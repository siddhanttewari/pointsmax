name: Devaluation Watch

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - test

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install feedparser requests
      - name: Run devaluation watch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python3 scripts/devaluation_watch.py --test | tee report.txt
          else
            python3 scripts/devaluation_watch.py | tee report.txt
          fi
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: devaluation-report
          path: report.txt
          retention-days: 30
      - name: Remember what was reported
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain scripts/seen.json)" ]; then
            git config user.name "devaluation-watch"
            git config user.email "actions@github.com"
            git add scripts/seen.json
            git commit -m "chore: update seen.json [skip ci]"
            git push || echo "seen.json push skipped - alerts still worked"
          fi
